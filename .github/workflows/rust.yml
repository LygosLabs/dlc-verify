name: Rust

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.1
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # clang compiles libsecp256k1 for wasm32; llvm-ar indexes the archive.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang llvm
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.127
      - run: tools/build-wasm.sh
        env:
          CC_wasm32_unknown_unknown: clang
          AR_wasm32_unknown_unknown: llvm-ar
      # The whole static site: the page in web/ and the module in web/pkg.
      - uses: actions/upload-artifact@v4
        with:
          name: dlc-verify-web
          path: web

  # Publishes the page built above to Vercel, from main only. Needs the VERCEL_TOKEN,
  # VERCEL_ORG_ID and VERCEL_PROJECT_ID secrets; without them it does nothing. See docs/web.md.
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, wasm]
    runs-on: ubuntu-latest
    concurrency: vercel-production
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dlc-verify-web
          path: web
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy to Vercel
        if: env.VERCEL_TOKEN != ''
        run: |
          npx --yes vercel@64.7.0 pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx --yes vercel@64.7.0 build --prod --token="$VERCEL_TOKEN"
          npx --yes vercel@64.7.0 deploy --prebuilt --prod --token="$VERCEL_TOKEN"
      - name: Skip
        if: env.VERCEL_TOKEN == ''
        run: echo "::notice::VERCEL_TOKEN is not set, so the page was not deployed."
