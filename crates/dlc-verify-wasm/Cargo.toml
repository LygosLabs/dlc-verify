[package]
name = "dlc-verify-wasm"
description = "dlc-verify for the browser: a WebAssembly module with a JSON API"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
dlc-verify-core = { workspace = true }
dlc-verify-policy = { workspace = true }
dlc-verify-settle = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
wasm-bindgen = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# rand_core asks getrandom for entropy; in a browser it comes from crypto.getRandomValues.
getrandom = { version = "0.2", features = ["js"] }
# Small precomputed tables for both copies of libsecp256k1 (plain and zkp): the default ones
# are over a megabyte each and do not compress. Verification is somewhat slower.
secp256k1-zkp = { workspace = true, features = ["lowmemory"] }

[lints]
workspace = true
